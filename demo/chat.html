<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnosis Chat — Car Assistance</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span class="micro ink">Diagnosis Assistant</span>
  </header>

  <main class="chat-scroll" id="chat-scroll"></main>

  <div class="chat-cta">
    <div class="chips mb12" id="chat-quick" style="margin-bottom:10px">
      <button class="chip-btn" data-q="Engine shakes at idle">Engine shakes at idle</button>
      <button class="chip-btn" data-q="Check engine light is flashing">Check engine light flashing</button>
      <button class="chip-btn" data-q="Long cranking before start">Long cranking</button>
      <button class="chip-btn" data-q="Blower only works on max speed">Blower only on max</button>
    </div>
    <div class="chips hidden" id="chat-chips"></div>
    <div class="search mt12" style="margin-top:10px">
      <button id="chat-attach" class="attach-btn" aria-label="Attach a photo" title="Attach a photo">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <input id="chat-file" type="file" accept="image/*" hidden>
      <input id="chat-input" type="text" placeholder="Describe what the car is doing…">
      <button id="chat-ask" class="btn btn-primary" style="width:auto;min-height:36px;padding:0 14px;font-size:13px">Send</button>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" href="index.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>Home</span></a>
    <a class="tab active" href="chat.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>Chat</span></a>
    <a class="tab" href="mayday.html"><svg viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z"/><path d="M12 10v5"/></svg><span>Emergency</span></a>
  </nav>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
