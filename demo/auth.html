<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Car Assistance</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .form { padding: 20px 16px; }
  .form label { display: block; margin: 14px 0 6px; }
  .form .search input { padding: 0; }
  .toggle { display: flex; gap: 8px; margin: 16px; }
  .toggle .chip-btn { flex: 1; border-radius: var(--r-ctl); padding: 11px 0; text-align: center; }
  .msg { margin: 0 16px; padding: 10px 14px; border-radius: var(--r-ctl); font-size: 13px; display: none; }
  .msg.err { display: block; background: var(--danger-soft); color: var(--danger); }
  .msg.ok  { display: block; background: #E7F2EC; color: var(--safe); }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span class="micro ink" id="auth-title">Sign in</span>
  </header>

  <div class="band" style="padding:20px 16px">
    <div class="micro">My garage</div>
    <p class="ice small mt8">Sign in to save your W245 and get diagnoses linked to your car.</p>
  </div>

  <div class="toggle">
    <button class="chip-btn" id="t-login" style="background:var(--mist)">Sign in</button>
    <button class="chip-btn" id="t-signup" style="background:var(--paper)">Create account</button>
  </div>

  <div class="msg" id="msg"></div>

  <form class="form" id="f-login">
    <label class="micro ink" for="li-email">Email</label>
    <div class="search" style="background:var(--mist)"><input id="li-email" type="email" required placeholder="you@example.com"></div>
    <label class="micro ink" for="li-pass">Password</label>
    <div class="search" style="background:var(--mist)"><input id="li-pass" type="password" required placeholder="••••••••"></div>
    <button class="btn btn-primary mt16" type="submit">Sign in</button>
  </form>

  <form class="form hidden" id="f-signup">
    <label class="micro ink" for="su-name">Display name</label>
    <div class="search" style="background:var(--mist)"><input id="su-name" type="text" placeholder="e.g. Emam"></div>
    <label class="micro ink" for="su-email">Email</label>
    <div class="search" style="background:var(--mist)"><input id="su-email" type="email" required placeholder="you@example.com"></div>
    <label class="micro ink" for="su-pass">Password (8+ characters)</label>
    <div class="search" style="background:var(--mist)"><input id="su-pass" type="password" minlength="8" required placeholder="••••••••"></div>
    <button class="btn btn-primary mt16" type="submit">Create account</button>
  </form>

  <div class="section">
    <div class="block small mut">Requires the live backend (Supabase). Run it locally with <b>npm start</b> and set
      <b>localStorage['api_base']</b> — see README.md.</div>
  </div>

  <nav class="tabbar">
    <a class="tab" href="index.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>Home</span></a>
    <a class="tab" href="chat.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>Chat</span></a>
    <a class="tab" href="mayday.html"><svg viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z"/><path d="M12 10v5"/></svg><span>Emergency</span></a>
  </nav>
</div>

<script>
const apiBase = ((localStorage.getItem('api_base') || '') + '').replace(/\/+$/, '');
const msg = document.getElementById('msg');
function show(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; }
function setMode(mode) {
  document.getElementById('f-login').classList.toggle('hidden', mode !== 'login');
  document.getElementById('f-signup').classList.toggle('hidden', mode !== 'signup');
  document.getElementById('t-login').style.background = mode === 'login' ? 'var(--mist)' : 'var(--paper)';
  document.getElementById('t-signup').style.background = mode === 'signup' ? 'var(--mist)' : 'var(--paper)';
  document.getElementById('auth-title').textContent = mode === 'login' ? 'Sign in' : 'Create account';
  msg.className = 'msg';
}
document.getElementById('t-login').onclick = () => setMode('login');
document.getElementById('t-signup').onclick = () => setMode('signup');

async function post(path, body) {
  if (!apiBase) throw new Error('Backend not configured — see the note below.');
  const r = await fetch(apiBase + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || data.error || 'Request failed');
  return data;
}

document.getElementById('f-login').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await post('/api/auth-login', {
      email: document.getElementById('li-email').value.trim(),
      password: document.getElementById('li-pass').value
    });
    localStorage.setItem('ca_token', d.access_token);
    localStorage.setItem('ca_email', d.email);
    location.href = 'garage.html';
  } catch (err) { show('err', err.message); }
});

document.getElementById('f-signup').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await post('/api/auth-register', {
      email: document.getElementById('su-email').value.trim(),
      password: document.getElementById('su-pass').value,
      display_name: document.getElementById('su-name').value.trim()
    });
    if (d.needs_confirmation) return show('ok', d.message);
    localStorage.setItem('ca_token', d.access_token);
    localStorage.setItem('ca_email', d.email);
    location.href = 'garage.html';
  } catch (err) { show('err', err.message); }
});
</script>
</body>
</html>
