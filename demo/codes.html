<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fault Codes — Car Assistance</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span class="micro ink">Fault Codes · W245</span>
  </header>

  <div class="section">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <input id="code-search" type="text" placeholder="Search fault codes… (e.g. P0300)" autocomplete="off">
    </div>
  </div>

  <div class="hint" id="code-hint">Type a fault code (like <b>P0300</b>), a system (like <b>brakes</b>) or a symptom to search the documented W245 codebook.</div>

  <div class="section hidden" id="code-filters" style="padding-top:12px">
    <div class="chips">
      <button class="chip-btn" data-sev="ALL" style="background:var(--mist)">All</button>
      <button class="chip-btn" data-sev="HIGH">High</button>
      <button class="chip-btn" data-sev="MEDIUM">Medium</button>
      <button class="chip-btn" data-sev="LOW">Low</button>
    </div>
  </div>

  <section class="section hidden" id="code-list-section">
    <span class="micro" id="ws-note">Search results · Mercedes-Benz B-Class (W245)</span>
    <div class="rows" id="code-list"></div>
  </section>

  <nav class="tabbar">
    <a class="tab" href="index.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>Home</span></a>
    <a class="tab" href="chat.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>Chat</span></a>
    <a class="tab" href="mayday.html"><svg viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z"/><path d="M12 10v5"/></svg><span>Emergency</span></a>
  </nav>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/data-ar.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
