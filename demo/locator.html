<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Locator — Car Assistance</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span class="micro ink">Service Locator</span>
  </header>

  <div class="me-line">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="4"/><path d="M12 21c-4-4.5-6-7.5-6-10.5a6 6 0 0112 0C18 13.5 16 16.5 12 21z"/></svg>
    <span id="me-label">Downtown, Cairo (demo position)</span>
  </div>

  <div class="section hidden" id="code-note" style="padding-top:8px">
    <div class="sev-banner"><span class="dot" style="background:var(--ink)"></span><p id="ws-note"></p></div>
  </div>

  <section class="section">
    <span class="micro">Nearest workshops · sorted by distance</span>
    <div class="rows" id="ws-list"></div>
  </section>

  <section class="section">
    <div class="block small mut">Demo mode: distances are computed from a mock position using the haversine formula — the same service the live Service Locator will perform through the maps integration.</div>
  </section>

  <nav class="tabbar">
    <a class="tab" href="index.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>Home</span></a>
    <a class="tab" href="chat.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>Chat</span></a>
    <a class="tab" href="mayday.html"><svg viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z"/><path d="M12 10v5"/></svg><span>Emergency</span></a>
  </nav>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // show code-note banner when arriving from a diagnosis (?code=…)
  document.addEventListener('DOMContentLoaded', () => {
    if (new URLSearchParams(location.search).get('code')) {
      document.getElementById('code-note').classList.remove('hidden');
    }
  });
</script>
</body>
</html>
